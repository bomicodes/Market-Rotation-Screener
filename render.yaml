services:
  - type: web
    name: market-rotation-screener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --keep-alive 5 runtime_v2402:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: SCREENER_PASSWORD
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
      - key: UW_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
