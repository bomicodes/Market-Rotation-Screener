name: Apply v25.5 trade-plan integrity
on:
  push:
    paths:
      - 'scripts/patch_v25_5_trade_plan_integrity.py'
      - '.github/workflows/apply-v25-5-trade-plan-integrity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v25_5_trade_plan_integrity.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Verify integrity gates
        run: |
          grep -q 'APP_VERSION = "25.5"' app.py
          grep -q 'Invalid bullish level ordering' app.py
          grep -q 'Invalid bearish level ordering' app.py
          grep -q 'TradePlan:planOk' app.py
          grep -q 'structureOk' app.py
      - name: Run core regression tests
        run: |
          pip install -r requirements-dev.txt
          pytest tests/test_core_logic.py -q
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Enforce directional trade-plan integrity'
          git push
