name: Apply RRG history slider
on:
  push:
    branches:
      - feat/rrg-history-slider
    paths:
      - tools/apply_rrg_history_slider.py
      - .github/workflows/apply-rrg-history-slider.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rrg-history-slider
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply patch
        run: python tools/apply_rrg_history_slider.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Sanity-check timeline hooks
        run: |
          grep -q 'RRG_HISTORY_LEN = 200' app.py
          grep -q 'rrgTimelineSlider' app.py
          grep -q 'setupRRGTimeline();' app.py
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.11 add RRG history timeline slider'
          git push origin HEAD:feat/rrg-history-slider
