name: Apply v24.4 feed comparison
on:
  push:
    paths:
      - 'scripts/apply_v24_4_feed_comparison.py'
      - '.github/workflows/apply-v24-4-feed-comparison.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_v24_4_feed_comparison.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Core regression tests
        run: pytest tests/test_core_logic.py -q
      - name: Verify feed comparison markers
        run: |
          grep -q 'APP_VERSION = "24.4"' app.py
          grep -q '/api/feed-comparison/<ticker>' app.py
          grep -q 'function runFeedComparison()' app.py
          grep -q 'IEX (free)' app.py
          grep -q 'OPRA (paid)' app.py
      - name: Commit patched files
        run: |
          if git diff --quiet -- app.py README.txt; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git commit -m 'Add Alpaca free vs paid feed comparison'
          git push
