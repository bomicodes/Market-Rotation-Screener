name: Apply v25.33 Safari news context fix
on:
  push:
    paths: ['.github/workflows/apply-v25-33.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply patch
        run: python .patches/apply_v25_33.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.33"' in s
          assert '@app.route("/api/news-context", methods=["GET","POST"])' in s
          assert 'const newsUrl="/api/news-context"' in s
          assert 'method:"POST"' not in s[s.index('async function runNewsContext()'):s.index('const LIVE_WATCHLIST_KEY')]
          assert 'toLocaleString([], ' not in s
          print('v25.33 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_33.py .github/workflows/apply-v25-33.yml
          git add app.py README.txt
          git commit -m 'v25.33 harden Safari news context requests'
          git push
