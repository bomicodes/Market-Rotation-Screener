name: Apply v25.3 restore Top Setups
on:
  push:
    paths:
      - 'scripts/patch_v25_3_restore_top_setups.py'
      - '.github/workflows/apply-v25-3-restore-top-setups.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v25_3_restore_top_setups.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Verify Top Setups restore
        run: |
          grep -q 'APP_VERSION = "25.3"' app.py
          grep -q 'id="loadTopSetups"' app.py
          grep -q 'runAutomaticTopSetups(true)' app.py
          grep -q 'slice(0,60)' app.py
          grep -q 'n+=2' app.py
      - name: Run core regression tests
        run: |
          pip install -r requirements-dev.txt
          pytest tests/test_core_logic.py -q
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Restore Top Setups with controlled mobile scanning'
          git push
