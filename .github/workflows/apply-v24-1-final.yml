name: Apply v24.1 final correctness fixes
on:
  push:
    paths:
      - 'scripts/apply_v24_1_final_fixes.py'
      - '.github/workflows/apply-v24-1-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_v24_1_final_fixes.py
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py
      - run: pytest tests/test_core_logic.py tests/test_swing_reliability.py -q
      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish v24.1 swing trader reliability pass"
          git push
