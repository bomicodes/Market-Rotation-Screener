name: Apply RRG stable scale
on:
  push:
    branches:
      - feat/rrg-stable-history-scale
    paths:
      - tools/apply_rrg_stable_scale.py
      - .github/workflows/apply-rrg-stable-scale.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rrg-stable-history-scale
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply patch
        run: python tools/apply_rrg_stable_scale.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Sanity-check fixed scale hooks
        run: |
          grep -q 'fixedScale=undefined' app.py
          grep -q 'computeStableScale' app.py
          grep -q 'rrgTimelineScale' app.py
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.12 stabilize RRG history slider scale'
          git push origin HEAD:feat/rrg-stable-history-scale
# trigger
