name: Apply v25.12 direct
on:
  push:
    paths:
      - 'scripts/patch_v25_12.py'
      - '.github/workflows/apply-v25-12-direct.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_v25_12.py
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm scripts/patch_v25_12.py .github/workflows/apply-v25-12-direct.yml .github/workflows/apply-v25-12.yml
          git commit -m 'Apply v25.12 Alpaca option history fix'
          git push
