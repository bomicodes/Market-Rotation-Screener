name: Apply v26.7 Layer 2.5 timeout fix
on:
  push:
    paths:
      - '.github/workflows/apply-v26-7.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .patches/apply_v26_7_layer25_timeout.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "26.7"' in s
          assert 'const ac=new AbortController();' in s
          assert 'setTimeout(()=>ac.abort(),8000)' in s
          assert '{signal:ac.signal}' in s
          assert 'finally{clearTimeout(timer)}' in s
          assert s.count('Layer 2.5 · checking early daily reversals') == 1
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.txt
          git rm .patches/apply_v26_7_layer25_timeout.py .github/workflows/apply-v26-7.yml
          git commit -m "v26.7 bound Layer 2.5 chart-preview requests"
          git push
