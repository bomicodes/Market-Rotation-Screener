name: Apply v25.35 stock RRG click focus fix
on:
  push:
    paths: ['.github/workflows/apply-v25-35.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v25_35_rrg_click_focus_only.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.35"' in s
          interaction=s[s.index('function installRRGInteractions'):s.index('installRRGInteractions("sectorChart")')]
          assert 'openSectorStockTicker(ticker,{scroll:true})' not in interaction
          assert 'toggleRRGFocus(id,ticker)' in interaction
          print('v25.35 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_35_rrg_click_focus_only.py .github/workflows/apply-v25-35.yml
          git add app.py README.txt
          git commit -m 'v25.35 stock RRG click focuses tail in place'
          git push
