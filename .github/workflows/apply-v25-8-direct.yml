name: Apply v25.8 direct patch
on:
  push:
    paths: ['.github/workflows/apply-v25-8-direct.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify patch applies cleanly
        run: git apply --check .patches/v25.8.patch
      - name: Apply exact patch
        run: git apply .patches/v25.8.patch
      - name: Validate
        run: |
          python -m py_compile app.py
          if [ -f requirements-dev.txt ]; then pip install -q -r requirements-dev.txt && pytest -q; fi
      - name: Commit and remove temporary patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm .patches/v25.8.patch .github/workflows/apply-v25-8-direct.yml
          git commit -m 'v25.8: reject stale triggers and label profile sessions'
          git push
