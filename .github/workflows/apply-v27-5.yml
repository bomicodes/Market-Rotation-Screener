name: Apply v27.5 news styling and liquidity reasons

on:
  push:
    paths:
      - '.github/workflows/apply-v27-5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v27_5_news_liquidity.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          r=Path('README.txt').read_text()
          assert 'APP_VERSION = "27.5"' in s
          assert 'a.newsHeadline{color:#e5e7eb' in s
          assert 'a.newsHeadline:visited{color:#e5e7eb}' in s
          assert 'a.newsHeadline:hover{color:#7fd8ff' in s
          assert 'Options not liquid/tradable' not in s
          assert 'Illiquid chain · only ${tradableCount}' in s
          assert r.startswith('v27.5')
          print('validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.txt
          git rm .patches/apply_v27_5_news_liquidity.py .github/workflows/apply-v27-5.yml
          git commit -m "v27.5 fix news styling and explain liquidity failures"
          git push
