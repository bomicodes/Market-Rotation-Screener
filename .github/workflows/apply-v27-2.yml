name: Apply v27.2 holdings ticker sanitation

on:
  push:
    paths:
      - '.github/workflows/apply-v27-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v27_2_ticker_sanitation.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(); r=Path('README.txt').read_text()
          assert 'APP_VERSION = "27.2"' in s
          assert 'def _basic_us_equity_symbol(value):' in s
          assert 'def filter_us_equity_holdings(holdings):' in s
          assert 'ALPACA_TRADING_BASE_URL+"/v2/assets"' in s
          assert 'return filter_us_equity_holdings(out)' in s
          assert r.startswith('v27.2 — FILTER NON-US / MALFORMED HOLDING SYMBOLS')
          print('validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.txt
          git rm .patches/apply_v27_2_ticker_sanitation.py .github/workflows/apply-v27-2.yml
          git commit -m "v27.2 filter non-US holding symbols before scans"
          git push
