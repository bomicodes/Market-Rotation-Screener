name: Apply v25.32 Safari stock screen fix
on:
  push:
    paths: ['.github/workflows/apply-v25-32.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python .patches/apply_v25_32.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.32"' in s
          assert 'el.scrollIntoView(true);' in s
          assert 'el.scrollIntoView({behavior:' not in s
          assert 'const url=`/api/sector/${encodeURIComponent(requestedSector)}?limit=${encodeURIComponent(String(lim))}`;' in s
          print('v25.32 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_32.py .github/workflows/apply-v25-32.yml
          git add app.py README.txt
          git commit -m 'v25.32 harden Safari stock screen requests'
          git push
