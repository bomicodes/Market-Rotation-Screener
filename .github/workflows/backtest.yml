name: Print rotation backtest to the server log

# Asks the app to run the rotation STRAT backtest (earnings filter off/on) and write
# the results to its own server log. The response here contains no data, only "queued".
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional single ticker (prints its trade list)"
        required: false
        default: ""
      etf:
        description: "Sector ETF for the single ticker"
        required: false
        default: ""
      kind:
        description: "rotation (stock), options (premium replay, 2024+) or events (event study)"
        required: false
        default: "rotation"

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the backtest
        env:
          T: ${{ inputs.ticker }}
          E: ${{ inputs.etf }}
          K: ${{ inputs.kind }}
        run: |
          q=""; if [ -n "$T" ]; then q="?ticker=$(echo "$T" | tr -cd 'A-Za-z0-9')&etf=$(echo "$E" | tr -cd 'A-Za-z')"; fi
          path=rotation; if [ "$K" = "options" ]; then path=options; q=""; fi; if [ "$K" = "events" ]; then path=events; q=""; fi
          curl -s --max-time 90 "https://market-rotation-screener.onrender.com/api/backtest/$path/print$q" | head -c 200; echo
