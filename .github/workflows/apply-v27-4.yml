name: Apply v27.4 Top Setups scan speed

on:
  push:
    paths:
      - '.github/workflows/apply-v27-4.yml'
      - '.patches/apply_v27_4_scan_speed.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v27_4_scan_speed.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          r=Path('README.txt').read_text()
          assert 'APP_VERSION = "27.4"' in s
          assert 'for(let n=0;n<supportive.length;n+=4)' in s
          assert 'for(let n=0;n<finalists.length;n+=2)' in s
          assert 'const runPremiumSupportInBackground=async()=>{' in s
          assert 'safeTickerFetchJson("/api/chart-preview"' in s
          assert 'safeTickerUrl("/api/premium-support",ticker,{direction})' in s
          assert 'async function auditHoldings()' not in s
          assert r.startswith('v27.4')
          print('validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.txt
          git rm .patches/apply_v27_4_scan_speed.py .github/workflows/apply-v27-4.yml
          git commit -m "v27.4 speed up and harden Top Setups pipeline"
          git push
