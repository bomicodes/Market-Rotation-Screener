name: Audit and fix v24 institutional layer

on:
  push:
    paths:
      - '.github/workflows/audit-v24-fixes.yml'
      - '.github/scripts/audit_v24_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply fixes
        run: python .github/scripts/audit_v24_fix.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Validate rendered JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, app
          with app.app.test_client() as c:
              r=c.get('/')
              assert r.status_code in (200,302)
              if r.status_code==200:
                  html=r.get_data(as_text=True)
                  scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
                  pathlib.Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
      - name: Validate institutional route
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd, app
          idx=pd.date_range('2026-01-01',periods=120,freq='B')
          def prices(tickers,period='1y'):
              return pd.DataFrame({t:100+np.arange(len(idx))*(0.15+0.03*i) for i,t in enumerate(tickers)},index=idx)
          def ohlc(ticker,period='1y'):
              c=100+np.arange(len(idx))*0.2
              return pd.DataFrame({'Open':c-.1,'High':c+.5,'Low':c-.5,'Close':c,'Volume':1000000},index=idx)
          app.dl_prices=prices
          app.dl_ohlc=ohlc
          app.get_earnings_dates=lambda t,limit=16: []
          app.save_setup_snapshot=lambda payload: {'ok':True}
          app.setup_history_stats=lambda ticker,signature=None: {'count':0,'completed':0,'returns':{}}
          app.CACHE.clear()
          with app.app.test_client() as c:
              r=c.get('/api/institutional-context/TEST?parent=XLK')
              assert r.status_code==200, r.get_data(as_text=True)
              j=r.get_json()
              assert j['ok'] and j['ticker']=='TEST' and j['parent']=='XLK'
              assert j['structure']['available'] is True
              assert '5' in j['relative_strength'] and '20' in j['relative_strength']
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git commit -m "Fix v24 institutional scoring and expectancy audit issues" || exit 0
          git push
