name: Apply RRG std window
on:
  push:
    branches:
      - feat/rrg-std-window
    paths:
      - tools/apply_rrg_std_window.py
      - .github/workflows/apply-rrg-std-window.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rrg-std-window
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply patch
        run: python tools/apply_rrg_std_window.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.10 stabilize RRG z-score volatility window'
          git push origin HEAD:feat/rrg-std-window
