name: Fix deep-dive loading

on:
  push:
    paths:
      - '.github/workflows/fix-deep-dive-loading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart, STRAT, and flow loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()

          s=s.replace('APP_VERSION = "23.5"','APP_VERSION = "23.6"',1)

          old='''def dl_ohlc(ticker, period="3y"):\n    df = yf.download(\n        ticker, period=period, interval="1d", auto_adjust=True,\n        progress=False, threads=False, timeout=20\n    )\n    if df is None or len(df) == 0:\n        return pd.DataFrame()\n    if isinstance(df.columns, pd.MultiIndex):\n        df.columns = [c[0] for c in df.columns]\n    df.index = pd.to_datetime(df.index).tz_localize(None)\n    return df.sort_index()\n'''
          new='''def _yf_download_retry(ticker, period, interval="1d", timeout=12, attempts=2, prepost=False):\n    """Small fail-safe wrapper for Yahoo requests used by the deep-dive modules.\n\n    Yahoo occasionally stalls or returns an empty frame even for liquid symbols.\n    Keep retries bounded so one bad provider call cannot leave the chart/STRAT UI\n    spinning for a minute.\n    """\n    last=pd.DataFrame()\n    for attempt in range(max(1, attempts)):\n        try:\n            df=yf.download(\n                ticker, period=period, interval=interval, auto_adjust=True,\n                progress=False, threads=False, prepost=prepost, timeout=timeout\n            )\n            if df is not None and len(df):\n                if isinstance(df.columns,pd.MultiIndex):\n                    df.columns=[c[0] for c in df.columns]\n                df.index=pd.to_datetime(df.index).tz_localize(None)\n                return df.sort_index()\n            last=df if df is not None else pd.DataFrame()\n        except Exception:\n            pass\n        if attempt+1 < attempts:\n            time.sleep(0.6*(attempt+1))\n    return last if last is not None else pd.DataFrame()\n\ndef dl_ohlc(ticker, period="3y"):\n    # Cache successful daily history briefly because chart review and setup\n    # analytics frequently request the same symbol within seconds of each other.\n    key=f"ohlc-v23-6:{ticker.upper()}:{period}"\n    hit=CACHE.get(key)\n    if hit and time.time()-hit[0] < 300:\n        return hit[1].copy()\n    df=_yf_download_retry(ticker,period,"1d",timeout=12,attempts=2)\n    if df is not None and len(df):\n        CACHE[key]=(time.time(),df.copy())\n    return df if df is not None else pd.DataFrame()\n'''
          if old not in s:
              raise SystemExit('dl_ohlc block not found')
          s=s.replace(old,new,1)

          old='''        intraday=yf.download(ticker,period="60d",interval="60m",auto_adjust=True,progress=False,threads=False,prepost=False,timeout=20)\n        daily=yf.download(ticker,period="2y",interval="1d",auto_adjust=True,progress=False,threads=False,timeout=20)\n        for name,df in (("intraday",intraday),("daily",daily)):\n            if df is not None and len(df) and isinstance(df.columns,pd.MultiIndex):\n                df.columns=[c[0] for c in df.columns]\n'''
          new='''        intraday=_yf_download_retry(ticker,"60d","60m",timeout=12,attempts=2,prepost=False)\n        daily=dl_ohlc(ticker,"2y")\n'''
          if old not in s:
              raise SystemExit('api_strat download block not found')
          s=s.replace(old,new,1)

          old='''            df=yf.download(\n                ticker,period=yperiod,interval="60m",auto_adjust=True,\n                progress=False,threads=False,prepost=False,timeout=25\n            )\n            if df is not None and len(df):\n                if isinstance(df.columns,pd.MultiIndex):\n                    df.columns=[c[0] for c in df.columns]\n'''
          new='''            df=_yf_download_retry(ticker,yperiod,"60m",timeout=12,attempts=2,prepost=False)\n            if df is not None and len(df):\n'''
          if old not in s:
              raise SystemExit('chart intraday fallback block not found')
          s=s.replace(old,new,1)

          old='''        base,_,_=cached_refresh_safe(f"options-v21-2:{ticker.upper()}",lambda:options_quality_payload(ticker),ttl=600)\n        payload,stale,err=cached_refresh_safe(f"flow-v21-2:{ticker.upper()}",lambda:flow_payload(ticker,base),force=force,ttl=180)'''
          new='''        # Reuse the exact options payload already loaded by the deep-dive panel.\n        # Previously Flow used an old cache namespace, forcing a second full chain\n        # download immediately after /api/options and making the panel appear stuck.\n        base,_,_=cached_refresh_safe(f"options-v23:{ticker.upper()}:0-30",lambda:options_quality_payload(ticker,"0-30"),ttl=600)\n        payload,stale,err=cached_refresh_safe(f"flow-v23-6:{ticker.upper()}",lambda:flow_payload(ticker,base),force=force,ttl=600)'''
          if old not in s:
              raise SystemExit('flow cache block not found')
          s=s.replace(old,new,1)

          # Make Flow use the same safe relative endpoint helper as the other deep-dive modules.
          old='''   const r=await fetch(`/api/flow/${encodeURIComponent(ticker)}${force?"?refresh=1":""}`),j=await r.json();'''
          new='''   const r=await fetch(safeTickerEndpoint("/api/flow",ticker,force?"?refresh=1":""),{headers:{"Accept":"application/json"}}),j=await r.json();'''
          if old not in s:
              raise SystemExit('loadFlowTicker fetch block not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          python -m py_compile app.py
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/fix-deep-dive-loading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix-deep-dive-loading.yml
          git commit -m "Fix chart STRAT and institutional flow loading"
          git push origin HEAD:main