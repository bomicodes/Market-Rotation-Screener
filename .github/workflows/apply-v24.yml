          +# Situation), verified 2026-08-25. This deliberately does NOT try to guess
          +# future CPI/jobs-report dates beyond what's been officially confirmed —
          +# an invented date could give false confidence that a coming week is "clear"
          +# when a real print is scheduled. Extend this list as BLS/Fed publish new
          +# confirmed dates; each entry is safe to add independently.
          +MACRO_CALENDAR = [
          +    {"date": "2026-09-04", "type": "NFP",   "label": "Employment Situation (August)"},
          +    {"date": "2026-09-11", "type": "CPI",   "label": "CPI (August)"},
          +    {"date": "2026-09-16", "type": "FOMC",  "label": "FOMC Rate Decision"},
          +    {"date": "2026-10-27", "type": "FOMC",  "label": "FOMC meeting begins"},
          +    {"date": "2026-10-28", "type": "FOMC",  "label": "FOMC Rate Decision"},
          +    {"date": "2026-12-08", "type": "FOMC",  "label": "FOMC meeting begins"},
          +    {"date": "2026-12-09", "type": "FOMC",  "label": "FOMC Rate Decision"},
          +]
          +
          +def upcoming_macro_events(within_days=60):
          +    today = pd.Timestamp.now().normalize()
          +    cutoff = today + pd.Timedelta(days=within_days)
          +    out = []
          +    for ev in MACRO_CALENDAR:
          +        d = pd.Timestamp(ev["date"])
          +        if today <= d <= cutoff:
          +            out.append({**ev, "days_away": int((d - today).days)})
          +    return sorted(out, key=lambda x: x["date"])
