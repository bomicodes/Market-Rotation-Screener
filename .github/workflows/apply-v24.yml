          +# --- Data-source health tracking ------------------------------------------
          +# Five external dependencies feed this app (Alpaca, Finnhub, yfinance,
          +# Unusual Whales, Nasdaq/Yahoo earnings calendars). Individual endpoints
          +# already report per-request "stale"/"error" flags, but there was no single
          +# place to see "is everything actually healthy right now" at a glance.
          +# _mark_source() is called at each source's primary entry point; the
          +# resulting snapshot is served at /api/source-health.
          +_SOURCE_HEALTH = {}
          +_SOURCE_HEALTH_GUARD = threading.Lock()
          +_SOURCE_NAMES = ("yfinance", "alpaca_stocks", "alpaca_options", "finnhub", "unusual_whales", "nasdaq_yahoo_calendar")
          +
          +def _mark_source(name, ok, detail=None):
          +    now = datetime.utcnow().isoformat(timespec="seconds") + "Z"
          +    with _SOURCE_HEALTH_GUARD:
          +        row = _SOURCE_HEALTH.setdefault(name, {"last_success": None, "last_error": None, "last_error_detail": None, "last_was_success": None})
          +        if ok:
          +            row["last_success"] = now
          +        else:
          +            row["last_error"] = now
          +            row["last_error_detail"] = str(detail)[:300] if detail else None
          +        # Track which kind of event happened most recently directly, rather
          +        # than comparing two second-precision timestamps — a success and a
          +        # failure landing in the same second would tie under a timestamp
          +        # comparison and misreport status until the next event.
          +        row["last_was_success"] = ok
          +
          +def source_health_snapshot():
          +    with _SOURCE_HEALTH_GUARD:
          +        rows = {k: dict(v) for k, v in _SOURCE_HEALTH.items()}
          +    out = []
          +    for name in _SOURCE_NAMES:
          +        row = rows.get(name, {"last_success": None, "last_error": None, "last_error_detail": None, "last_was_success": None})
          +        if row["last_was_success"] is True:
          +            status = "ok"
          +        elif row["last_was_success"] is False:
          +            status = "degraded"
          +        else:
          +            status = "unknown"  # not called yet this process lifetime
          +        out.append({"name": name, "status": status, **row})
          +    return out
          +
