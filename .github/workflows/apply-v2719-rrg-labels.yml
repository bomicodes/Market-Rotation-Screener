name: Apply v27.19 RRG labels
on:
  push:
    branches: [feat/rrg-labels-v2719]
    paths:
      - tools/apply_v2719_rrg_labels.py
      - .github/workflows/apply-v2719-rrg-labels.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rrg-labels-v2719
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt
          pip install pytest
      - run: python tools/apply_v2719_rrg_labels.py
      - run: python -m py_compile app.py
      - run: pytest -q
      - name: Validate labels and unchanged internal modes
        run: |
          grep -q 'APP_VERSION = "27.19"' app.py
          grep -q 'TIMEFRAME' app.py
          grep -q 'SENSITIVITY' app.py
          grep -q '>EARLY<' app.py
          grep -q '>CONFIRMED<' app.py
          grep -q 'EARLY ROTATION (10/5)' app.py
          grep -q 'CONFIRMED ROTATION (25/12)' app.py
          grep -q 'sectorRRGMode="fast"' app.py
          grep -q 'sectorRRGMode==="trend"' app.py
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.19 clarify RRG timeframe and sensitivity labels'
          git pull --rebase origin feat/rrg-labels-v2719
          git push origin HEAD:feat/rrg-labels-v2719
