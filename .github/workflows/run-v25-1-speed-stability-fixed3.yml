name: Run v25.1 speed stability final
on:
  push:
    paths:
      - 'scripts/run_v25_1_speed_stability_fixed3.py'
      - '.github/workflows/run-v25-1-speed-stability-fixed3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/run_v25_1_speed_stability_fixed3.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Verify stability changes
        run: |
          grep -q 'APP_VERSION = "25.1"' app.py
          grep -q 'alpaca-day-v25-1' app.py
          grep -q 'alpaca-hour-v25-1' app.py
          grep -q 'visible-v25-1' app.py
          grep -q 'strat-v25-1' app.py
          grep -q 'institutional-v25-1' app.py
          grep -q 'tickerRequestInflight' app.py
          grep -q 'flow deferred for faster loading' app.py
      - name: Run core regression tests
        run: |
          pip install -r requirements-dev.txt
          pytest tests/test_core_logic.py -q
      - name: Commit patched app
        run: |
          git checkout -- scripts/patch_v25_1_speed_stability.py
          if git diff --quiet -- app.py; then echo 'No changes needed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Speed ticker loading and remove duplicate data fetches'
          git push
