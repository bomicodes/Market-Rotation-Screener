name: Apply v25.8 patch
on:
  push:
    paths: ['.github/workflows/apply-v25-8.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact uploaded patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          def rep(old,new,label):
              global s
              assert old in s, f'{label} not found'
              s=s.replace(old,new,1)
          rep('APP_VERSION = "25.7"','APP_VERSION = "25.8"','version')
          old='''    # Integrity gate: directional plans must have levels in the correct order.\n    plan_valid=True;plan_error=None\n    if direction=="bullish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation < trigger < target1 <= target2)\n        if not plan_valid: plan_error="Invalid bullish level ordering"\n    elif direction=="bearish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation > trigger > target1 >= target2)\n        if not plan_valid: plan_error="Invalid bearish level ordering"'''
          new='''    # Integrity gate: directional plans must have levels in the correct order,\n    # AND the trigger must still be within a plausible distance of current\n    # price. A trigger can pass the ordering check yet be a stale relic of a\n    # large intra-window move (e.g. a rally from the 20-day low to a spike and\n    # back) that's left the 20-day extreme many ATRs away from where price\n    # actually is now — technically ordered, but not an actionable near-term\n    # level. Three ATRs matches this plan's own target2 convention (trigger\n    # +/- 3*atr) — a trigger already that far from spot describes a price\n    # regime the stock has since moved on from.\n    plan_valid=True;plan_error=None\n    max_trigger_distance=3*atr if atr>0 else None\n    if direction=="bullish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation < trigger < target1 <= target2)\n        if not plan_valid: plan_error="Invalid bullish level ordering"\n        elif max_trigger_distance is not None and abs(spot-trigger)>max_trigger_distance:\n            plan_valid=False;plan_error="Trigger is too far from current price (stale 20-day level after a large move)"\n    elif direction=="bearish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation > trigger > target1 >= target2)\n        if not plan_valid: plan_error="Invalid bearish level ordering"\n        elif max_trigger_distance is not None and abs(spot-trigger)>max_trigger_distance:\n            plan_valid=False;plan_error="Trigger is too far from current price (stale 20-day level after a large move)"'''
          rep(old,new,'integrity gate')
          rep('      <div class="vpLevelStrip" id="vpLevelStrip">','      <div class="tiny" id="vpSessionLabel" style="color:#7f97a8;margin:2px 0 4px">Session: —</div>\n      <div class="vpLevelStrip" id="vpLevelStrip">','vp label')
          rep('        <div class="valueAcceptanceLevels">','        <div class="tiny" id="valueAcceptanceRefLabel" style="color:#7f97a8;margin-top:2px">Reference: —</div>\n        <div class="valueAcceptanceLevels">','va label')
          rep('''       pill=document.getElementById("valueAcceptancePill"),detail=document.getElementById("valueAcceptanceDetail");''','''       pill=document.getElementById("valueAcceptancePill"),detail=document.getElementById("valueAcceptanceDetail"),\n       refLabel=document.getElementById("valueAcceptanceRefLabel");''','ref binding')
          rep('''   detail.textContent="Needs a completed prior-session/prior-week profile.";''','''   detail.textContent="Needs a completed prior-session/prior-week profile.";\n   if(refLabel)refLabel.textContent="Reference: —";''','empty ref')
          rep(''' detail.textContent=sig.detail;''',''' detail.textContent=sig.detail;\n if(refLabel)refLabel.textContent=`Reference: ${sig.referenceLabel||"—"}`;''','ref render')
          rep(''' let activeLatest=null;''',''' let activeLatest=null,activeLatestDate=null;''','latest date')
          rep('''     const last=rows[rows.length-1];activeLatest=weekMap.get(weekKey(last))||null;''','''     const last=rows[rows.length-1],wk=weekKey(last);activeLatest=weekMap.get(wk)||null;if(activeLatest)activeLatestDate=wk;''','week date')
          rep('''     for(let i=rows.length-1;i>=0&&!activeLatest;i--)activeLatest=sessionMap.get(rowDateKey(rows[i]))||null;''','''     for(let i=rows.length-1;i>=0&&!activeLatest;i--){const dk=rowDateKey(rows[i]);const found=sessionMap.get(dk);if(found){activeLatest=found;activeLatestDate=dk;}}''','session date')
          rep('''  }\n\n  // Current price badge.''','''  }else if(previewVPMode==="session"){\n   const sessions=visibleProfiles.sessions||[];if(sessions.length)activeLatestDate=sessions[sessions.length-1].date;\n }else if(previewVPMode==="previous"){\n   const sessions=visibleProfiles.sessions||[];if(sessions.length>=2)activeLatestDate=sessions[sessions.length-2].date;\n }\n\n  // Current price badge.''','mode dates')
          rep(''' payload._activeSessionProfile=activeLatest||singleVp||null;''',''' payload._activeSessionProfile=activeLatest||singleVp||null;\n payload._activeSessionDate=activeLatestDate;''','payload date')
          rep('''   const topVah=document.getElementById("vpVahTop"),topPoc=document.getElementById("vpPocTop"),topVal=document.getElementById("vpValTop");''','''   const topVah=document.getElementById("vpVahTop"),topPoc=document.getElementById("vpPocTop"),topVal=document.getElementById("vpValTop"),sessLabel=document.getElementById("vpSessionLabel");''','session binding')
          rep('''   if(topVal)topVal.textContent=activeVp?`$${Number(activeVp.val).toFixed(2)}`:"—";''','''   if(topVal)topVal.textContent=activeVp?`$${Number(activeVp.val).toFixed(2)}`:"—";\n   if(sessLabel){\n     const modeName=previewVPMode==="previous"?"Previous session":previewVPMode==="session"?"Session":"Latest available session";\n     sessLabel.textContent=activeVp?`Session: ${modeName}${j._activeSessionDate?` (${j._activeSessionDate})`:""} — may differ from the Value Acceptance card's prior-session reference`:"Session: —";\n   }''','session render')
          p.write_text(s)
          r=Path('README.txt'); rs=r.read_text()
          entry='''v25.8 — TRIGGER PROXIMITY CHECK + SESSION LABELING (reported on VST)\n- Trade-plan integrity gate now also rejects a trigger that's too far from current price, not just an incorrectly-ordered one. A 20-day high/low based trigger can pass the existing ordering check yet still be a stale relic of a large intra-window move. New check: reject if |spot-trigger| > 3x ATR, matching the plan's own target2 convention.\n- The Chart Preview VAH/POC/VAL legend and the Value Acceptance card can legitimately show different numbers because they intentionally reference different sessions. Both panels now show an explicit session/reference label.\n\n'''
          if not rs.startswith('v25.8'): r.write_text(entry+rs)
      - name: Validate
        run: |
          python -m py_compile app.py
          if [ -f requirements-dev.txt ]; then pip install -q -r requirements-dev.txt && pytest -q; fi
      - name: Commit and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm .github/workflows/apply-v25-8.yml
          git commit -m 'v25.8: reject stale triggers and label profile sessions'
          git push
