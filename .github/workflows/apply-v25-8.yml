name: Apply v25.8 patch
on:
  push:
    paths: ['.github/workflows/apply-v25-8.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v25.8 patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          s=s.replace('APP_VERSION = "25.7"','APP_VERSION = "25.8"',1)
          old='''    # Integrity gate: directional plans must have levels in the correct order.\n    plan_valid=True;plan_error=None\n    if direction=="bullish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation < trigger < target1 <= target2)\n        if not plan_valid: plan_error="Invalid bullish level ordering"\n    elif direction=="bearish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation > trigger > target1 >= target2)\n        if not plan_valid: plan_error="Invalid bearish level ordering"'''
          new='''    # Integrity gate: directional plans must have levels in the correct order,\n    # AND the trigger must still be within a plausible distance of current\n    # price. A trigger can pass the ordering check yet be a stale relic of a\n    # large intra-window move that's left the 20-day extreme many ATRs away.\n    # Three ATRs matches this plan's own target2 convention (trigger +/- 3*atr).\n    plan_valid=True;plan_error=None\n    max_trigger_distance=3*atr if atr>0 else None\n    if direction=="bullish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation < trigger < target1 <= target2)\n        if not plan_valid: plan_error="Invalid bullish level ordering"\n        elif max_trigger_distance is not None and abs(spot-trigger)>max_trigger_distance:\n            plan_valid=False;plan_error="Trigger is too far from current price (stale 20-day level after a large move)"\n    elif direction=="bearish" and trigger is not None:\n        plan_valid=(invalidation is not None and target1 is not None and target2 is not None and invalidation > trigger > target1 >= target2)\n        if not plan_valid: plan_error="Invalid bearish level ordering"\n        elif max_trigger_distance is not None and abs(spot-trigger)>max_trigger_distance:\n            plan_valid=False;plan_error="Trigger is too far from current price (stale 20-day level after a large move)"'''
          assert old in s, 'integrity gate block not found'; s=s.replace(old,new,1)
          old='<div class="vpLevelStrip" id="vpLevelStrip">'; new='<div class="tiny" id="vpSessionLabel" style="color:#7f97a8;margin:2px 0 4px">Session: —</div>\n      '+old
          assert old in s; s=s.replace(old,new,1)
          old='<div class="valueAcceptanceLevels">'; new='<div class="tiny" id="valueAcceptanceRefLabel" style="color:#7f97a8;margin-top:2px">Reference: —</div>\n        '+old
          assert old in s; s=s.replace(old,new,1)
          old='''       pill=document.getElementById("valueAcceptancePill"),detail=document.getElementById("valueAcceptanceDetail");'''
          new='''       pill=document.getElementById("valueAcceptancePill"),detail=document.getElementById("valueAcceptanceDetail"),\n       refLabel=document.getElementById("valueAcceptanceRefLabel");'''
          assert old in s; s=s.replace(old,new,1)
          old='''    detail.textContent="Needs a completed prior-session/prior-week profile.";'''; new=old+'\n    if(refLabel)refLabel.textContent="Reference: —";'; assert old in s; s=s.replace(old,new,1)
          old='''  detail.textContent=sig.detail;'''; new=old+'\n  if(refLabel)refLabel.textContent=`Reference: ${sig.referenceLabel||"—"}`;'; assert old in s; s=s.replace(old,new,1)
          old=''' let activeLatest=null;'''; new=''' let activeLatest=null,activeLatestDate=null;'''; assert old in s; s=s.replace(old,new,1)
          old='''     const last=rows[rows.length-1];activeLatest=weekMap.get(weekKey(last))||null;'''; new='''     const last=rows[rows.length-1],wk=weekKey(last);activeLatest=weekMap.get(wk)||null;if(activeLatest)activeLatestDate=wk;'''; assert old in s; s=s.replace(old,new,1)
          old='''     for(let i=rows.length-1;i>=0&&!activeLatest;i--)activeLatest=sessionMap.get(rowDateKey(rows[i]))||null;'''; new='''     for(let i=rows.length-1;i>=0&&!activeLatest;i--){const dk=rowDateKey(rows[i]);const found=sessionMap.get(dk);if(found){activeLatest=found;activeLatestDate=dk;}}'''; assert old in s; s=s.replace(old,new,1)
          old='''  }\n\n  // Current price badge.'''; new='''  }else if(previewVPMode==="session"){\n    const sessions=visibleProfiles.sessions||[];if(sessions.length)activeLatestDate=sessions[sessions.length-1].date;\n  }else if(previewVPMode==="previous"){\n    const sessions=visibleProfiles.sessions||[];if(sessions.length>=2)activeLatestDate=sessions[sessions.length-2].date;\n  }\n\n  // Current price badge.'''; assert old in s; s=s.replace(old,new,1)
          old=''' payload._activeSessionProfile=activeLatest||singleVp||null;'''; new=old+'\n payload._activeSessionDate=activeLatestDate;'; assert old in s; s=s.replace(old,new,1)
          old='''   const topVah=document.getElementById("vpVahTop"),topPoc=document.getElementById("vpPocTop"),topVal=document.getElementById("vpValTop");'''; new='''   const topVah=document.getElementById("vpVahTop"),topPoc=document.getElementById("vpPocTop"),topVal=document.getElementById("vpValTop"),sessLabel=document.getElementById("vpSessionLabel");'''; assert old in s; s=s.replace(old,new,1)
          old='''   if(topVal)topVal.textContent=activeVp?`$${Number(activeVp.val).toFixed(2)}`:"—";'''; new=old+'''\n   if(sessLabel){\n     const modeName=previewVPMode==="previous"?"Previous session":previewVPMode==="session"?"Session":"Latest available session";\n     sessLabel.textContent=activeVp?`Session: ${modeName}${j._activeSessionDate?` (${j._activeSessionDate})`:""} — may differ from the Value Acceptance card's prior-session reference`:"Session: —";\n   }'''; assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          r=Path('README.txt'); rs=r.read_text(); rs='''v25.8 — TRIGGER PROXIMITY CHECK + SESSION LABELING (reported on VST)\n- Trade-plan integrity gate now also rejects a trigger that's too far from current price, not just an incorrectly-ordered one. New check: reject if |spot-trigger| > 3x ATR, matching the plan's own target2 convention.\n- The Chart Preview VAH/POC/VAL legend and the Value Acceptance card intentionally reference different sessions; both panels now show explicit session/reference labels so legitimate differences no longer look like a bug.\n\n'''+rs; r.write_text(rs)
      - name: Validate
        run: |
          python -m py_compile app.py
          if [ -f requirements-dev.txt ]; then pip install -q -r requirements-dev.txt && pytest -q; fi
      - name: Commit and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm .github/workflows/apply-v25-8.yml
          git commit -m 'v25.8: reject stale triggers and label profile sessions'
          git push
