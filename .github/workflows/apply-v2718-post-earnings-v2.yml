name: Apply v27.18 Post-Earnings v2
on:
  push:
    branches:
      - feat/post-earnings-v2-v2718
    paths:
      - tools/apply_v2718_post_earnings_v2.py
      - .github/workflows/apply-v2718-post-earnings-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-earnings-v2-v2718
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply patch
        run: |
          # The existing renderEarnings sort has changed shape across versions.
          # Backend order is already setup-score sorted and hydration explicitly
          # reranks by Trade Score, so this intermediate rewrite is unnecessary.
          sed -i '/# Sort by hydrated Trade Score, then stock setup score\./,+1d' tools/apply_v2718_post_earnings_v2.py
          python tools/apply_v2718_post_earnings_v2.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Validate Post-Earnings v2 boundaries
        run: |
          grep -q 'APP_VERSION = "27.18"' app.py
          grep -q 'after_hours_aligned' app.py
          grep -q 'prelim\[:20\]' app.py
          grep -q 'rows\[:12\]' app.py
          grep -q 'move_consumed_pct' app.py
          grep -q 'remaining_runway_pct' app.py
          grep -q 'reversion_confirmed' app.py
          grep -q 'peTradeScore' app.py
          grep -q 'peSetupFilter' app.py
          grep -q 'Day 10 close' app.py
          grep -q 'postearnings-opportunities-v2:' app.py
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.18 upgrade post-earnings opportunity engine'
          git checkout -- tools/apply_v2718_post_earnings_v2.py
          git pull --rebase origin feat/post-earnings-v2-v2718
          git push origin HEAD:feat/post-earnings-v2-v2718
