name: Apply v26.3 temporal opportunity lanes
on:
  push:
    paths:
      - '.github/workflows/apply-v26-3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .patches/apply_v26_3_temporal_lanes.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "26.3"' in s
          assert "phase:'CONTINUATION'" in s
          assert 'VOLUME CONTINUATION' in s
          assert 'v263OpportunityLane' in s
          assert 'Continuation already underway' in s
          assert 'v263Lane v263' in s
          assert '$1,652/contract' not in s or '/contract' in s
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.txt
          git commit -m "v26.3 add early continuation confirmed opportunity lanes"
          git rm .patches/apply_v26_3_temporal_lanes.py .github/workflows/apply-v26-3.yml
          git commit --amend --no-edit
          git push
