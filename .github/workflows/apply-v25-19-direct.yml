name: Apply v25.19 direct
on:
  push:
    paths:
      - '.github/workflows/apply-v25-19-direct.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact patch
        run: |
          printf '\n' >> .patches/v25.19.patch
          git apply --check .patches/v25.19.patch
          git apply .patches/v25.19.patch
      - name: Validate
        run: |
          python -m py_compile app.py
          grep -q 'APP_VERSION = "25.19"' app.py
          grep -q 'EARLY TURN WATCH' app.py
          grep -q 'strongestLaggingSectors' app.py
          if [ -f requirements-dev.txt ]; then pip install -q -r requirements-dev.txt && pytest -q; fi
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm -f .patches/v25.19.patch .github/workflows/apply-v25-19-direct.yml
          git commit -m 'v25.19: add Early Turn Watch'
          git push
