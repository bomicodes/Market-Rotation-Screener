name: Apply v25.25 Safari navigation hardening
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_v25_25_safari_navigation.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path("app.py").read_text()
          assert 'APP_VERSION = "25.25"' in s
          assert 'scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"})' in s
          assert 'el.scrollIntoView(true)' in s
          assert 'openSectorStockTicker(t,{scroll:true})' in s
          assert 'loadChartPreview(t);\n     loadStrat(t);' not in s
          assert 'if(el)el.scrollIntoView()' not in s
          print("v25.25 validation passed")
          PY
      - name: Commit and self-clean
        run: |
          rm -f scripts/patch_v25_25_safari_navigation.py .github/workflows/apply-v25-25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v25.25: harden Safari stock and watchlist navigation"
          git push
