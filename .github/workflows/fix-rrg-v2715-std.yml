name: Fix RRG v27.15 std window
on:
  push:
    branches:
      - feat/rrg-weekly-calibration-v2715
    paths:
      - tools/fix_rrg_v2715_std.py
      - .github/workflows/fix-rrg-v2715-std.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rrg-weekly-calibration-v2715
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python tools/fix_rrg_v2715_std.py
      - run: python -m py_compile app.py
      - run: pytest -q
      - name: Verify exact weekly calibration
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd
          import app
          assert app.rrg_calibration('1d') == (63, 4.0)
          assert app.rrg_calibration('1w') == (13, 9.0)
          idx=pd.bdate_range('2020-01-02', periods=1650)
          bench=pd.Series(100*np.exp(np.linspace(0,.45,len(idx))),index=idx)
          asset=bench*(1+0.03*np.sin(np.linspace(0,18,len(idx))))
          px=pd.DataFrame({'SPY':bench,'XLK':asset})
          weekly=app.rrg_resample_prices(px,'1w')
          r1,m1=app.compute_rrg(weekly.SPY.values,weekly.XLK.values,25,12,timeframe='1w')
          r2,m2=app.compute_rrg(weekly.SPY.values,weekly.XLK.values,25,12,std_window=13,timeframe='1w',despike_threshold_pct=9.0)
          assert np.allclose(r1,r2,equal_nan=True)
          assert np.allclose(m1,m2,equal_nan=True)
          print('exact weekly std calibration passed')
          PY
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.15 use exact timeframe RRG std window'
          git pull --rebase origin feat/rrg-weekly-calibration-v2715
          git push origin HEAD:feat/rrg-weekly-calibration-v2715
