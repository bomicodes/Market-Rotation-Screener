name: Apply v27.9 patches v2
on:
  push:
    branches:
      - feat/leaps-rrg-zscore
    paths:
      - tools/apply_v279_patches.py
      - .github/workflows/apply-v279-patches-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/leaps-rrg-zscore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply patches
        run: python tools/apply_v279_patches.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.9 add LEAPS liquidity and z-score RRG'
          git push origin HEAD:feat/leaps-rrg-zscore
