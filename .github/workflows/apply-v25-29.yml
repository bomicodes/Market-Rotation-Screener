name: Apply v25.29 news context
on:
  push:
    paths: ['.github/workflows/apply-v25-29.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v25_29.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.29"' in s
          assert '@app.post("/api/news-context")' in s
          assert 'NEWS + CATALYST CONTEXT' in s
          assert 'function runNewsContext()' in s
          assert 'Why it matters:' in s
          print('v25.29 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_29.py .github/workflows/apply-v25-29.yml
          git add app.py README.txt
          git commit -m 'v25.29 add news and catalyst context'
          git push
