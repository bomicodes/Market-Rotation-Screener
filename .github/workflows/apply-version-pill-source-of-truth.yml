name: Apply version pill patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply_version_pill_patch.py
      - name: Validate
        run: |
          python -m py_compile app.py
          grep -F '{{APP_VERSION_PLACEHOLDER}}' app.py
          grep -F 'page = str(HTML).replace("{{APP_VERSION_PLACEHOLDER}}", f"v{APP_VERSION}")' app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Use APP_VERSION as UI version source of truth'
          git push origin HEAD:main
