name: Apply mobile stability hotfix
on:
  push:
    paths:
      - 'scripts/patch_v25_2_mobile_stability.py'
      - '.github/workflows/apply-v25-2-mobile-stability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v25_2_mobile_stability.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Verify hotfix
        run: |
          grep -q 'Top Setups auto-scan paused on mobile' app.py
          grep -q 'const waits=\[0,1000,3000,7000,12000\]' app.py
          grep -q '_client_stale:true' app.py
      - name: Run core regression tests
        run: |
          pip install -r requirements-dev.txt
          pytest tests/test_core_logic.py -q
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then echo 'No changes needed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Prevent mobile scan bursts and retry transient service failures'
          git push
