name: Apply v25.26 deterministic institutional context
on:
  push:
    paths: ['.github/workflows/apply-v25-26.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v25_26.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.26"' in s
          assert 'def dark_pool_spike_context' in s
          assert 'if multiple>=2.0:' in s
          assert 'instContextRow' in s
          print('v25.26 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_26.py .github/workflows/apply-v25-26.yml
          git add app.py README.txt
          git commit -m 'v25.26 deterministic institutional spike context'
          git push
