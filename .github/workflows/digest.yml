name: Print digest to the server log

# Asks the app to write its plain-text digest (board, open trades, strangles) -- or,
# with tickers, a check of those tickers -- to its own server log. The response here
# contains no data, only "queued".
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma-separated tickers to check instead of the full digest"
        required: false
        default: ""

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the digest
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then q="?tickers=$(echo "$TICKERS" | tr -cd 'A-Za-z0-9,.-')"; else q=""; fi
          curl -s --max-time 90 "https://market-rotation-screener.onrender.com/api/digest/print$q" | head -c 200; echo
