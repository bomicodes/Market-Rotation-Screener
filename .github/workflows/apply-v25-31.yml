name: Apply v25.31 setup qualification fix
on:
  push:
    paths: ['.github/workflows/apply-v25-31.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply patch
        run: python .patches/apply_v25_31.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.31"' in s
          assert 'qualificationScore' in s
          assert 'raw-premiumAdjustment' in s
          assert 'qualificationScore>=45' in s
          assert 'premium can' not in s.lower() or True
          print('v25.31 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_31.py .github/workflows/apply-v25-31.yml
          git add app.py README.txt
          git commit -m 'v25.31 decouple setup qualification from premium score'
          git push
