name: Apply v25.24 institutional activity radar
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_v25_24_institutional_radar.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.24"' in s
          assert '/api/institutional-radar' in s
          assert 'Institutional Activity Top Setups' in s
          assert 'runInstitutionalRadar' in s
          assert 'not a complete tape' in s
          print('v25.24 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          rm -f scripts/patch_v25_24_institutional_radar.py .github/workflows/apply-v25-24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v25.24: add separate institutional activity top setups"
          git push
