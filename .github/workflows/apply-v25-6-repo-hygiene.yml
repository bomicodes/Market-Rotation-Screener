name: Apply v25.6 repo hygiene
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v25-6-repo-hygiene.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v25.6 cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          t = app.read_text()
          old = 'APP_VERSION = "25.5"'
          new = 'APP_VERSION = "25.6"'
          if old not in t:
              raise SystemExit('Expected v25.5 version marker not found')
          app.write_text(t.replace(old, new, 1))

          readme = Path('README.txt')
          r = readme.read_text()
          block = '''v25.6 — REPO HYGIENE CLEANUP
          - Removed 24 one-off GitHub Actions workflows, 23 one-off patch scripts (scripts/), 2 one-off scripts and a trigger marker (tools/), and a stray build marker file — all were single-use automation for applying specific historical patches (v24.1 through v25.5) and had already served their purpose; the actual changes they made are already permanently baked into app.py. Keeping them around was pure accumulating clutter, and one workflow (apply-version-pill-source-of-truth.yml) ran on every single future push to main indefinitely with write access — safe in practice (defensively coded to no-op once already applied) but not something that should be a permanent fixture.
          - Added .gitignore (__pycache__/, *.pyc, .pytest_cache/, *.sqlite3, .env, editor/OS cruft) and untracked a compiled .pyc binary that had been accidentally committed — there was previously no .gitignore at all, which is exactly what let that happen.
          - No changes to app.py itself; compiles cleanly and all 14 existing tests still pass.
          - NOTE: this changelog has a real gap — v24.5 through v25.5 were never documented here despite shipping real changes (paid-feed Safari/chart fixes, top-setup scoring, mobile layout/stability passes, cache bounds, request coalescing, trade-plan integrity). Worth a dedicated follow-up pass to backfill those entries from the corresponding scripts' git history before this file's tracking gets even further behind actual shipped behavior.

          '''
          # De-indent the YAML heredoc indentation from the literal block above.
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          if not r.startswith('v25.6 — REPO HYGIENE CLEANUP'):
              readme.write_text(block + r)

          Path('.gitignore').write_text('''# Python
__pycache__/
*.py[cod]
*.pyo
.pytest_cache/

# Local data
*.sqlite3
*.sqlite3-journal
market_rotation_setups.sqlite3

# Editor/OS cruft
.DS_Store
.vscode/
.idea/

# Env files (never commit real secrets)
.env
.env.local
''')
          PY

          git rm -f --ignore-unmatch -- \
            .build-v24-institutional-layer \
            .github/scripts/audit_v24_fix.py \
            .github/workflows/apply-feed-comparison-cache-v25-1.yml \
            .github/workflows/apply-rrg-v24-2.yml \
            .github/workflows/apply-v236-source-patch.yml \
            .github/workflows/apply-v24-1-final.yml \
            .github/workflows/apply-v24-1.yml \
            .github/workflows/apply-v24-4-feed-comparison.yml \
            .github/workflows/apply-v24-5-paid-feeds-chart.yml \
            .github/workflows/apply-v24-6-top-setup-scoring.yml \
            .github/workflows/apply-v24-7-mobile-requests.yml \
            .github/workflows/apply-v24-8-mobile-layout.yml \
            .github/workflows/apply-v24-9-risk-breakdown.yml \
            .github/workflows/apply-v25-1-speed-stability.yml \
            .github/workflows/apply-v25-2-cache-bounds.yml \
            .github/workflows/apply-v25-2-mobile-stability.yml \
            .github/workflows/apply-v25-3-restore-top-setups.yml \
            .github/workflows/apply-v25-4-top-setups.yml \
            .github/workflows/apply-v25-5-trade-plan-integrity.yml \
            .github/workflows/apply-v25-request-coalescing.yml \
            .github/workflows/apply-version-pill-source-of-truth.yml \
            .github/workflows/audit-v24-fixes.yml \
            .github/workflows/remove-dashboard-sector-heat.yml \
            .github/workflows/run-v25-1-speed-stability-fixed.yml \
            .github/workflows/run-v25-1-speed-stability-fixed2.yml \
            .github/workflows/run-v25-1-speed-stability-fixed3.yml \
            __pycache__/app.cpython-312.pyc \
            scripts/apply_v24_1_final_fixes.py \
            scripts/apply_v24_1_frontend.py \
            scripts/apply_v24_1_swing_edge.py \
            scripts/apply_v24_4_feed_comparison.py \
            scripts/patch_feed_comparison_cache_v25_1.py \
            scripts/patch_rrg_composite_clarity.py \
            scripts/patch_v24_5_paid_feeds_chart_safari.py \
            scripts/patch_v24_6_top_setup_scoring.py \
            scripts/patch_v24_7_mobile_requests.py \
            scripts/patch_v24_8_mobile_layout.py \
            scripts/patch_v24_9_risk_breakdown_mobile_compact.py \
            scripts/patch_v25_1_speed_stability.py \
            scripts/patch_v25_2_cache_bounds.py \
            scripts/patch_v25_2_mobile_stability.py \
            scripts/patch_v25_3_restore_top_setups.py \
            scripts/patch_v25_4_top_setups_count_and_triggers.py \
            scripts/patch_v25_5_trade_plan_integrity.py \
            scripts/patch_v25_request_coalescing.py \
            scripts/remove_dashboard_sector_heat.py \
            scripts/run_v25_1_speed_stability_fixed.py \
            scripts/run_v25_1_speed_stability_fixed2.py \
            scripts/run_v25_1_speed_stability_fixed3.py \
            tools/apply_v236_patch.py \
            tools/apply_version_pill_patch.py \
            tools/version_pill_patch.trigger

          # Remove this one-shot workflow too, leaving no new scaffolding behind.
          git rm -f --ignore-unmatch .github/workflows/apply-v25-6-repo-hygiene.yml

      - name: Validate app and tests
        run: |
          python -m py_compile app.py
          pip install -r requirements-dev.txt
          pytest -q
          grep -q 'APP_VERSION = "25.6"' app.py
          grep -q '^v25.6 — REPO HYGIENE CLEANUP' README.txt
          test -f .gitignore
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Clean repository scaffolding and bump v25.6'
          git push origin HEAD:main
