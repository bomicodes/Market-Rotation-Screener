name: Apply v24.6 Top Setup scoring calibration
on:
  push:
    paths:
      - 'scripts/patch_v24_6_top_setup_scoring.py'
      - '.github/workflows/apply-v24-6-top-setup-scoring.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_v24_6_top_setup_scoring.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Verify markers
        run: |
          grep -q 'APP_VERSION = "24.6"' app.py
          grep -q 'RRG alignment, tail direction and quadrant are correlated' app.py
          grep -q 'missing chart/STRAT evidence is no longer treated like a neutral pass' app.py
      - name: Run regression tests
        run: |
          pip install -r requirements-dev.txt
          pytest tests/test_core_logic.py -q
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Calibrate Top Setup scoring and confirmation gates'
          git push
