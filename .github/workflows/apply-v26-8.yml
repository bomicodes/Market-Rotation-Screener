name: Apply v26.8 safeTickerFetchJson timeout

on:
  push:
    paths:
      - '.github/workflows/apply-v26-8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v26_8_safe_fetch_timeout.py
      - name: Validate Python syntax and patch markers
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          r=Path('README.txt').read_text()
          assert 'APP_VERSION = "26.8"' in s
          assert 'const requestTimeoutMs=Number(opts.timeoutMs)||12000;' in s
          assert 'signal:ac.signal' in s
          assert 'finally{clearTimeout(timer)}' in s
          assert 'Request timed out after ${requestTimeoutMs}ms' in s
          assert r.startswith('v26.8 — TIMEOUT FOR safeTickerFetchJson')
          print('validation passed')
          PY
      - name: Commit v26.8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.txt
          git rm .patches/apply_v26_8_safe_fetch_timeout.py .github/workflows/apply-v26-8.yml
          git commit -m "v26.8 bound safeTickerFetchJson request time"
          git push
