name: Apply v25.37 mobile premium reliability
on:
  push:
    paths: ['.github/workflows/apply-v25-37.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v25_37.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.37"' in s
          assert 'fetchPremiumSupportReliable' in s
          assert 'rehydrateMissingPremiumSupport' in s
          assert 'retryable:true' in s
          assert 'ttl=1800' in s
          print('v25.37 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_37.py .github/workflows/apply-v25-37.yml
          git add app.py README.txt
          git commit -m 'v25.37 harden Top Setup premium loading on mobile'
          git push
