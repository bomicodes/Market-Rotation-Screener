name: Apply v25.6 repo hygiene fixed
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v25_6_repo_hygiene.py'
      - '.github/workflows/apply-v25-6-repo-hygiene-fixed.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python scripts/apply_v25_6_repo_hygiene.py
      - name: Validate
        run: |
          python -m py_compile app.py
          pip install -r requirements-dev.txt
          pytest -q
          grep -q 'APP_VERSION = "25.6"' app.py
          grep -q '^v25.6 — REPO HYGIENE CLEANUP' README.txt
          test -f .gitignore
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Clean repository scaffolding and bump v25.6'
          git push origin HEAD:main
