name: Remove redundant dashboard sector heat map
on:
  push:
    paths:
      - 'scripts/remove_dashboard_sector_heat.py'
      - '.github/workflows/remove-dashboard-sector-heat.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dashboard simplification
        run: python scripts/remove_dashboard_sector_heat.py
      - name: Python syntax check
        run: python -m py_compile app.py
      - name: Verify dashboard heat removed
        run: |
          grep -q 'APP_VERSION = "24.3"' app.py
          ! grep -q 'SECTOR ROTATION HEAT MAP' app.py
          grep -q 'v24.3 dashboard simplification' app.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Remove redundant dashboard sector heat map'
          git push
