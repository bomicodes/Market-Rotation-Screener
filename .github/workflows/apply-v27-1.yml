name: Apply v27.1 Safari-safe Layer 2.5 request

on:
  push:
    paths:
      - '.github/workflows/apply-v27-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .patches/apply_v27_1_safari_safe_layer25.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(); r=Path('README.txt').read_text()
          assert 'APP_VERSION = "27.1"' in s
          assert '@app.route("/api/early-reversal-scan",methods=["GET","POST"])' in s
          start=s.find('Layer 2.5 · checking early daily reversals')
          end=s.find('candidates=candidates.sort',start)
          layer25=s[start:end]
          assert start >= 0 and end > start
          assert 'const request=fetch(url);' in layer25
          assert 'encodeURIComponent(tickerList)' in layer25
          assert 'fetch("/api/early-reversal-scan",{method:"POST"' not in layer25
          assert r.startswith('v27.1 — SAFARI-SAFE LAYER 2.5')
          print('validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.txt
          git rm .patches/apply_v27_1_safari_safe_layer25.py .github/workflows/apply-v27-1.yml
          git commit -m "v27.1 make Layer 2.5 bulk request Safari-safe"
          git push
