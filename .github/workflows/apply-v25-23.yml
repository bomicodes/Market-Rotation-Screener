name: Apply v25.23 Safari DOMException fix
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_v25_23_safari_scrollinto.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.23"' in s
          assert 'function safeScrollIntoView' in s
          assert 'scrollIntoView({behavior:' not in s
          assert 'new URLSearchParams({limit:String(lim)})' not in s
          print('v25.23 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          rm -f scripts/patch_v25_23_safari_scrollinto.py .github/workflows/apply-v25-23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v25.23: fix Safari DOMException in stock and watchlist UI"
          git push
