name: Patch RRG v27.8
on:
  push:
    branches: [feat/rrg-quant-metrics]
    paths:
      - tools/patch_rrg_v278.py
      - .github/workflows/patch-rrg-v278.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rrg-quant-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/patch_rrg_v278.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.8 quantify RRG rotation metrics'
          git push origin HEAD:feat/rrg-quant-metrics
