name: Apply v25.9 premium support scanner
on:
  push:
    paths:
      - '.github/workflows/apply-v25-9-premium-support.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch script
        run: python scripts/apply_v25_9_premium_support.py
      - name: Validate
        run: |
          python -m py_compile app.py
          pip install -q -r requirements-dev.txt
          pytest -q
      - name: Commit and remove temporary patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt tests/test_premium_support.py
          git rm scripts/apply_v25_9_premium_support.py
          git rm .github/workflows/apply-v25-9-premium-support.yml
          git commit -m 'v25.9: add premium support and compression scanner'
          git push
