name: Apply v25.22 holdings reliability
on:
  push:
    paths:
      - 'apply_v25_22.py'
      - '.github/workflows/apply-v25-22.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v25.22 patch
        run: python apply_v25_22.py
      - name: Install and validate
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m py_compile app.py
          grep -q 'APP_VERSION = "25.22"' app.py
          grep -q 'def _load_holdings_cache' app.py
          grep -q 'Invesco official top holdings fallback (PARTIAL)' app.py
          grep -q 'html5lib>=1.1' requirements.txt
          pytest -q
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt requirements.txt
          git rm -f apply_v25_22.py .github/workflows/apply-v25-22.yml
          git commit -m 'v25.22: harden ETF holdings and provider fallbacks'
          git push
