name: Apply v25.30 premium entry overlay
on:
  push:
    paths: ['.github/workflows/apply-v25-30.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply patch
        run: python .patches/apply_v25_30.py
      - name: Validate
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          assert 'APP_VERSION = "25.30"' in s
          assert 'const usingPremiumWatch=false;' in s
          assert 'const rows=qualified.slice(0,6);' in s
          assert 'Premium state does not determine qualification.' in s
          assert 'PREMIUM ENTRY' in s
          assert 'if(!["REVERSAL CONFIRMED","AT SUPPORT","NEAR SUPPORT"]' not in s
          print('v25.30 validation passed')
          PY
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .patches/apply_v25_30.py .github/workflows/apply-v25-30.yml
          git add app.py README.txt
          git commit -m 'v25.30 make premium support an entry-quality overlay'
          git push
