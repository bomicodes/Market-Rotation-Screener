 </div><div class="tiny" style="margin-top:6px">Confirmation is trigger ± 0.15 ATR. Invalidation uses recent structure + 20D mean; hard fail uses the broader 20D/50D structure. These are decision heuristics, not stop-loss instructions.</div></div>`;
}
const _topSetupEvaluationV23=topSetupEvaluation;
topSetupEvaluation=function(x){
 const b=_topSetupEvaluationV23(x),c=institutionalContextMap[x.ticker];if(!c)return {...b,factors:factorBreakdownFor(x,b,null)};
 let score=b.score;const rs20=c.relative_strength?.["20"]||{};
 if(c.triple_relative_strength)score+=6;else {if(Number(rs20.vs_spy)>0)score+=3;if(Number(rs20.vs_parent)>0)score+=3;}
 if(Number(c.rotation_persistence)>=80)score+=4;else if(Number(c.rotation_persistence)<50)score-=4;
 if(c.catalyst?.days_to_earnings!=null&&c.catalyst.days_to_earnings<=3)score-=10;
 const gx=gexImplicationFor(x.ticker,c);if(gx.detail.includes("headwind"))score-=4;else if(gx.detail.includes("accelerate"))score+=3;
 score=Math.max(0,Math.min(100,Math.round(score)));
 return {...b,score,context:c,factors:factorBreakdownFor(x,b,c)};
};
