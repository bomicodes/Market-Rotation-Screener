name: Build v24 institutional decision layer

on:
  push:
    paths:
      - '.github/workflows/build-v24-institutional-layer.yml'
      - '.github/scripts/v24_patch.py'
      - '.build-v24-institutional-layer'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python .github/scripts/v24_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/build-v24-institutional-layer.yml .github/scripts/v24_patch.py .build-v24-institutional-layer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v24 institutional decision layer"
          git push origin HEAD:main
