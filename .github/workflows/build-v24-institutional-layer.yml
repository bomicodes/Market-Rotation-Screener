on:
  push:
    paths:
      - '.github/workflows/build-v24-institutional-layer.yml'
      - '.build-v24-institutional-layer'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v24 institutional decision layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          text=p.read_text()
          text=text.replace('APP_VERSION = "23.6"','APP_VERSION = "24.0"',1)

          backend=r'''

def _ctx_return(series, sessions):
    try:
        s=series.dropna()
        if len(s)<=sessions:return None
        return float((s.iloc[-1]/s.iloc[-1-sessions]-1)*100)
    except Exception:
        return None


def _context_earnings_catalyst(ticker):
    today=pd.Timestamp.now().normalize()
    try:
        dates=get_earnings_dates(ticker, 16)
    except Exception:
        dates=[]
    future=[]
    for d in dates:
        try:
            x=pd.Timestamp(d).normalize()
            if x>=today: future.append(x)
        except Exception:
            pass
    if not future:
        return {"next_earnings":None,"days_to_earnings":None,"risk":"Unknown"}
    nxt=min(future)
    days=int((nxt-today).days)
    risk="Binary / imminent" if days<=3 else ("Near-term" if days<=10 else "Clear")
    return {"next_earnings":nxt.strftime("%Y-%m-%d"),"days_to_earnings":days,"risk":risk}


def _context_structure(ticker):
    df=dl_ohlc(ticker,"1y")
    if df is None or len(df)<55:
        return {"available":False}
    df=df.dropna(subset=["Open","High","Low","Close"]).copy()
    c=df["Close"].astype(float); h=df["High"].astype(float); l=df["Low"].astype(float)
    spot=float(c.iloc[-1])
    prev=c.shift(1)
    tr=pd.concat([(h-l).abs(),(h-prev).abs(),(l-prev).abs()],axis=1).max(axis=1)
    atr=float(tr.rolling(14).mean().iloc[-1]) if len(tr)>=14 else float((h-l).tail(14).mean())
    sma20=float(c.rolling(20).mean().iloc[-1]); sma50=float(c.rolling(50).mean().iloc[-1])
    hi20=float(h.iloc[-21:-1].max()); lo20=float(l.iloc[-21:-1].min())
    hi10=float(h.iloc[-11:-1].max()); lo10=float(l.iloc[-11:-1].min())
    bull=spot>=sma20 and sma20>=sma50
    bear=spot<=sma20 and sma20<=sma50
    direction="bullish" if bull else ("bearish" if bear else "neutral")
    if direction=="bullish":
        trigger=hi20
        confirmation=trigger+0.15*atr
        invalidation=max(lo10,sma20-0.35*atr)
        hard_fail=max(lo20,sma50-0.5*atr)
        target1=max(trigger+1.5*atr,spot+1.25*atr)
        target2=max(trigger+3.0*atr,spot+2.5*atr)
        risk=max(0.01,trigger-invalidation)
        reward=max(0.0,target2-trigger)
    elif direction=="bearish":
        trigger=lo20
        confirmation=trigger-0.15*atr
        invalidation=min(hi10,sma20+0.35*atr)
        hard_fail=min(hi20,sma50+0.5*atr)
        target1=min(trigger-1.5*atr,spot-1.25*atr)
        target2=min(trigger-3.0*atr,spot-2.5*atr)
        risk=max(0.01,invalidation-trigger)
        reward=max(0.0,trigger-target2)
    else:
        trigger=hi20; confirmation=hi20+0.15*atr; invalidation=lo10; hard_fail=lo20
        target1=hi20+1.5*atr; target2=hi20+3.0*atr
        risk=max(0.01,trigger-invalidation); reward=max(0.0,target2-trigger)
    rr=reward/risk if risk>0 else None
    trend_strength=0
    if spot>sma20:trend_strength+=1
    if sma20>sma50:trend_strength+=1
    r20=_ctx_return(c,20); r50=_ctx_return(c,50)
    if r20 is not None and r20>0:trend_strength+=1
    if r50 is not None and r50>0:trend_strength+=1
    return {
        "available":True,"spot":round(spot,2),"atr14":round(atr,2),"direction":direction,
        "trend_strength":trend_strength,"sma20":round(sma20,2),"sma50":round(sma50,2),
        "trigger":round(trigger,2),"confirmation":round(confirmation,2),"invalidation":round(invalidation,2),
        "hard_fail":round(hard_fail,2),"target1":round(target1,2),"target2":round(target2,2),
        "rr_to_target2":round(rr,2) if rr is not None else None,
        "return_20d":round(r20,2) if r20 is not None else None,
        "return_50d":round(r50,2) if r50 is not None else None,
    }


def institutional_context_payload(ticker,parent=None):
    ticker=ticker.upper().strip(); parent=(parent or "").upper().strip() or None
    universe=[ticker,"SPY"]+([parent] if parent and parent not in (ticker,"SPY") else [])
    px=dl_prices(universe,"1y")
    stock=px[ticker].dropna() if ticker in px else pd.Series(dtype=float)
    spy=px["SPY"].dropna() if "SPY" in px else pd.Series(dtype=float)
    par=px[parent].dropna() if parent and parent in px else pd.Series(dtype=float)
    rs={}
    positives=0; observed=0
    for n in (5,10,20):
        sr=_ctx_return(stock,n); mr=_ctx_return(spy,n)
        pr=_ctx_return(par,n) if len(par) else None
        vs_market=(sr-mr) if sr is not None and mr is not None else None
        vs_parent=(sr-pr) if sr is not None and pr is not None else None
        rs[str(n)]={
            "stock":round(sr,2) if sr is not None else None,
            "vs_spy":round(vs_market,2) if vs_market is not None else None,
            "vs_parent":round(vs_parent,2) if vs_parent is not None else None,
        }
        for v in (vs_market,vs_parent):
            if v is not None:
                observed+=1
                if v>0: positives+=1
    persistence=round(100*positives/observed) if observed else None
    triple=bool(parent and all((rs[str(n)].get("vs_spy") or -999)>0 and (rs[str(n)].get("vs_parent") or -999)>0 for n in (5,10,20)))
    structure=_context_structure(ticker)
    catalyst=_context_earnings_catalyst(ticker)
    if structure.get("trend_strength",0)>=4 and persistence is not None and persistence>=67:
        horizon="1–3 week swing"
    elif structure.get("trend_strength",0)>=2:
        horizon="2–5 day swing"
    else:
        horizon="Tactical / wait for confirmation"
    signature=f"v24|{parent or 'NONE'}|{horizon}|{'triple' if triple else 'mixed-rs'}|{structure.get('direction','neutral')}"
    snap={"ticker":ticker,"spot":structure.get("spot"),"bias":structure.get("direction"),"score":persistence,"signature":signature,
          "raw":{"parent":parent,"relative_strength":rs,"structure":structure,"horizon":horizon,"catalyst":catalyst}}
    try:
        save_setup_snapshot(snap)
    except Exception:
        pass
    try:
        hist=setup_history_stats(ticker,signature)
        if not hist.get("count"):
            hist=setup_history_stats(ticker)
            hist["fallback_all_signatures"]=True
    except Exception as e:
        hist={"count":0,"returns":{},"error":str(e)}
    return {
        "ticker":ticker,"parent":parent,"relative_strength":rs,"rotation_persistence":persistence,
        "triple_relative_strength":triple,"structure":structure,"horizon":horizon,"catalyst":catalyst,
        "signature":signature,"historical_expectancy":hist,
    }

@app.get("/api/institutional-context/<ticker>")
def api_institutional_context(ticker):
    try:
        parent=(request.args.get("parent") or "").upper().strip() or None
        key=f"institutional-v24:{ticker.upper()}:{parent or 'NONE'}"
        payload=cached(key,lambda:institutional_context_payload(ticker,parent),ttl=900)
        return jsonify({"ok":True,**payload})
    except Exception as e:
        return jsonify({"ok":False,"error":str(e)}),500

