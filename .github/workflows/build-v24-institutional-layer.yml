// -------------------- v24 Institutional Decision Layer --------------------
const institutionalContextMap={};
let activeInstitutionalTicker=null;
function instFmt(v,d=1){const n=Number(v);return Number.isFinite(n)?`${n>0?"+":""}${n.toFixed(d)}%`:"—"}
function instMoney(v){const n=Number(v);return Number.isFinite(n)?`$${n.toFixed(2)}`:"—"}
function ensureInstitutionalPanel(){
 let el=document.getElementById("institutionalDecisionPanel");if(el)return el;
 el=document.createElement("div");el.id="institutionalDecisionPanel";el.className="panel instDecisionPanel";
 el.innerHTML='<div class="note">Institutional decision layer loads with the selected ticker.</div>';
 const anchor=document.getElementById("stockDeepDiveAnchor")||document.getElementById("pricePreviewChart");
 if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(el,anchor);
 return el;
}
function flowEvidenceFor(ticker){
 const x=(activeFlowData?.ticker===ticker)?activeFlowData:null;if(!x)return {label:"Pending",score:null,detail:"Load options/flow"};
 const cp=Number(x.institutional_call_pct),pp=Number(x.institutional_put_pct),cov=Number(x.activity_coverage_pct),high=Number(x.high_relevance_events||0);
 let score=0;if(Number.isFinite(cov))score+=Math.min(45,cov*.45);score+=Math.min(35,high*7);if((x.institutional_events||0)>0)score+=20;
 const mix=Number.isFinite(cp)&&cp>=65?"Call-heavy":Number.isFinite(pp)&&pp>=65?"Put-heavy":"Balanced";
 const direction=x.direction_available?"direction classified":"direction unconfirmed";
 return {label:`${mix} evidence`,score:Math.round(Math.min(100,score)),detail:`${x.coverage_confidence||"?"} coverage · ${high} high relevance · ${direction}`};
}
function gexImplicationFor(ticker,ctx){
 const o=(activeOptionsData?.ticker===ticker)?activeOptionsData:optionScanMap[ticker],p=o?.positioning;if(!p?.available)return {label:"Pending",detail:"Load GEX/options positioning"};
 const dir=ctx?.structure?.direction||"neutral",spot=Number(o?.spot||ctx?.structure?.spot),wall=dir==="bearish"?Number(p.put_wall):Number(p.call_wall),reg=String(p.gamma_regime||"");
 let room=null;if(Number.isFinite(spot)&&spot>0&&Number.isFinite(wall))room=dir==="bearish"?(spot-wall)/spot*100:(wall-spot)/spot*100;
 let label=reg.includes("Negative")?"Amplifying regime":reg.includes("Positive")?"Dampening regime":"Mixed gamma";
 let detail=reg||"Dealer gamma unavailable";
 if(room!=null)detail+=` · ${room.toFixed(1)}% room to ${dir==="bearish"?"put":"call"} wall`;
 if(reg.includes("Positive")&&room!=null&&room<=1.5)detail+=" · breakout headwind";
 else if(reg.includes("Negative")&&room!=null&&room>2)detail+=" · continuation can accelerate";
 return {label,detail,room};
}
function histExpectancyLabel(h){
 if(!h||!h.count)return {label:"Building sample",detail:"Snapshot database will accumulate this setup signature"};
 const r=h.returns?.[5]||h.returns?.["5"]||{};
 return {label:`${h.count} snapshots`,detail:`5D win ${r.win_rate==null?"—":r.win_rate+"%"} · median ${r.median==null?"—":r.median+"%"}`};
}
function factorBreakdownFor(x,base,ctx){
 const rs=ctx?.relative_strength||{},p=ctx?.rotation_persistence,cat=ctx?.catalyst||{},hist=ctx?.historical_expectancy||{},flow=flowEvidenceFor(x.ticker),gex=gexImplicationFor(x.ticker,ctx);
 const r5=rs["5"]||{},r20=rs["20"]||{};
 return [
  ["Rotation",base.alignment==="FULL"?10:base.alignment==="EARLY"?9:5],
  ["Market RS",r20.vs_spy>0?10:r5.vs_spy>0?7:3],
  ["Sector RS",r20.vs_parent>0?10:r5.vs_parent>0?7:ctx?.parent?3:5],
  ["Persistence",p==null?5:Math.round(p/10)],
  ["Structure",ctx?.structure?.trend_strength==null?5:Math.min(10,ctx.structure.trend_strength*2.5)],
  ["Flow",flow.score==null?5:Math.round(flow.score/10)],
  ["GEX",gex.detail.includes("headwind")?3:gex.detail.includes("accelerate")?9:6],
  ["Execution",optionScanMap[x.ticker]?.liquidity==="Liquid"?10:optionScanMap[x.ticker]?.liquidity==="Tradable"?8:4],
  ["Expectancy",hist.count?7:5],
  ["Catalyst",cat.days_to_earnings!=null&&cat.days_to_earnings<=3?1:cat.days_to_earnings!=null&&cat.days_to_earnings<=10?5:9]
 ];
}
async function loadInstitutionalContext(ticker,parent=null,quiet=false){
 ticker=normalizeStockTicker(ticker);if(!ticker)return null;activeInstitutionalTicker=ticker;
 const el=ensureInstitutionalPanel();if(el&&!quiet)el.innerHTML=`<div class="note">Loading ${ticker} institutional decision layer…</div>`;
 try{
