  if(activeInstitutionalTicker===ticker)renderInstitutionalContext(ticker);renderTopSetups();return j;
 }catch(e){if(el&&!quiet)el.innerHTML=`<span class="warn">Institutional layer: ${e.message}</span>`;return null}
}
