name: Apply v25.2 cache bounds
on:
  push:
    paths:
      - 'scripts/patch_v25_2_cache_bounds.py'
      - '.github/workflows/apply-v25-2-cache-bounds.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply patch
        run: python scripts/patch_v25_2_cache_bounds.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Verify cache bounds
        run: |
          grep -q 'APP_VERSION = "25.2"' app.py
          grep -q 'CACHE_MAX_ENTRIES' app.py
          grep -q 'def _trim_cache' app.py
          python - <<'PY'
          import app
          app.CACHE.clear()
          app.CACHE_MAX_ENTRIES=40
          for i in range(55): app.CACHE[str(i)]=(float(i), {'x':i})
          removed=app._trim_cache(force=True)
          assert removed > 0
          assert len(app.CACHE) <= 40
          print('bounded cache ok', len(app.CACHE))
          PY
      - name: Run core regression tests
        run: pytest tests/test_core_logic.py -q
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then echo 'No changes needed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Bound in-process cache to control memory growth'
          git push
