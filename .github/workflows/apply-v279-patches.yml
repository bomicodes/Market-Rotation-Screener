name: Apply v27.9 patches
on:
  push:
    branches: [feat/leaps-rrg-zscore]
    paths:
      - patches/leaps-premium-support.patch
      - patches/rrg-zscore.patch
      - .github/workflows/apply-v279-patches.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/leaps-rrg-zscore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Check patches
        run: |
          git apply --check patches/leaps-premium-support.patch
          git apply patches/leaps-premium-support.patch
          git apply --check patches/rrg-zscore.patch
      - name: Apply RRG patch
        run: git apply patches/rrg-zscore.patch
      - name: Bump app version
        run: python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          old='APP_VERSION = "27.8"'
          if old not in s:
              raise SystemExit('expected v27.8 app version not found')
          p.write_text(s.replace(old,'APP_VERSION = "27.9"',1))
          PY
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.9 add LEAPS liquidity and z-score RRG'
          git push origin HEAD:feat/leaps-rrg-zscore
