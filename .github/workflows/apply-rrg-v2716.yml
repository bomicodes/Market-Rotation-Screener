name: Apply RRG v27.16
on:
  push:
    branches:
      - feat/rrg-slider-pin-v2716
    paths:
      - tools/apply_rrg_v2716.py
      - .github/workflows/apply-rrg-v2716.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rrg-slider-pin-v2716
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply patch
        run: python tools/apply_rrg_v2716.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Validate slider pin hooks
        run: |
          grep -q 'rrgTimelinePinnedDate=null' app.py
          grep -q 'rrgTimelineScrubbing=false' app.py
          grep -q 'Never let a background refresh move the physical thumb' app.py
          grep -q 'APP_VERSION = "27.16"' app.py
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.16 pin RRG history selection during refresh'
          git pull --rebase origin feat/rrg-slider-pin-v2716
          git push origin HEAD:feat/rrg-slider-pin-v2716
