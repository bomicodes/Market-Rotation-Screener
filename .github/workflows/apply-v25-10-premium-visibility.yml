name: Apply v25.10 premium visibility
on:
  push:
    paths:
      - 'scripts/patch_v25_10_premium_visibility.py'
      - '.github/workflows/apply-v25-10-premium-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/patch_v25_10_premium_visibility.py
      - name: Validate
        run: |
          python -m py_compile app.py
          pytest -q
      - name: Commit and clean patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm scripts/patch_v25_10_premium_visibility.py .github/workflows/apply-v25-10-premium-visibility.yml
          git commit -m 'v25.10 premium scanner visibility and fallback'
          git push
