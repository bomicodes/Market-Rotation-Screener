name: Apply v25.16 nearest-miss diagnostics
on:
  push:
    paths: ['.github/workflows/apply-v25-16.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch script
        run: python .tmp/apply_v25_16.py
      - name: Validate
        run: |
          python -m py_compile app.py
          pip install -q -r requirements-dev.txt
          pytest -q
      - name: Commit and remove temporary patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm .tmp/apply_v25_16.py .github/workflows/apply-v25-16.yml
          git commit -m 'v25.16: show Top Setups nearest-miss diagnostics'
          git push
