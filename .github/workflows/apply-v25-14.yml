name: Apply v25.14 premium full chain
on:
  push:
    paths:
      - '.github/workflows/apply-v25-14.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch script
        run: python scripts/patch_v25_14.py
      - name: Validate
        run: |
          python -m py_compile app.py
          pip install -q -r requirements-dev.txt
          pytest -q
      - name: Commit and remove temporary patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm scripts/patch_v25_14.py .github/workflows/apply-v25-14.yml
          git commit -m 'v25.14: scan full 7-90 DTE premium chain'
          git push origin main
