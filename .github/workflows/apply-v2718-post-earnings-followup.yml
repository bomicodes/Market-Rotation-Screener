name: Apply v27.18 Post-Earnings follow-up
on:
  push:
    branches:
      - feat/post-earnings-v2-v2718
    paths:
      - tools/apply_v2718_post_earnings_followup.py
      - .github/workflows/apply-v2718-post-earnings-followup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-earnings-v2-v2718
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply follow-up
        run: python tools/apply_v2718_post_earnings_followup.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Test
        run: pytest -q
      - name: Validate ranking follow-up
        run: |
          grep -q 'Archetype-neutral pre-rank' app.py
          grep -q 'prelim\[:20\]' app.py
          grep -q 'base\*\.72' app.py
          grep -q 'if(!x?.best_contract)' app.py
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'v27.18 balance post-earnings ranking and execution'
          git pull --rebase origin feat/post-earnings-v2-v2718
          git push origin HEAD:feat/post-earnings-v2-v2718
