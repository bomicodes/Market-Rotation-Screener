name: Apply v25.21 directly
on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_v25_21.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch to source
        run: python apply_v25_21.py
      - name: Validate
        run: |
          python -m py_compile app.py
          grep -q 'APP_VERSION = "25.21"' app.py
          pytest tests/test_core_logic.py -q
      - name: Commit source and clean temporary patching
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.txt
          git rm -f apply_v25_21.py
          git rm -f patch_v25_21.py || true
          python - <<'PY'
          from pathlib import Path
          p=Path('render.yaml')
          s=p.read_text()
          s=s.replace('buildCommand: python patch_v25_21.py && pip install -r requirements.txt','buildCommand: pip install -r requirements.txt')
          p.write_text(s)
          PY
          git add render.yaml
          git rm -f .github/workflows/apply-v25-21-direct.yml
          git commit -m 'v25.21: cache post-earnings scanner and serve stale fallback'
          git push
